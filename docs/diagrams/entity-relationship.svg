<text x="80" y="1538.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#315e50">HOW TO READ</text>
<text x="80" y="1585.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#243a36">A count near an entity gives how many relationship instances that entity may participate in.</text>
<text x="80" y="1630.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#243a36">Example: a customer places 0..N orders; an order is placed by 0..1 customer (guests are allowed).</text>
<text x="80" y="1675.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#243a36">Each order has 1..N line items. Rewards belong to the same member as their order; guest orders earn none.</text>
<text x="80" y="1720.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#243a36">An order generates at most one earn entry and one redeem entry. Minimum one line item is enforced by checkout.</text>
</svg>